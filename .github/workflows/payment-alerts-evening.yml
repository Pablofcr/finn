name: Payment alerts — evening nudge

# Runs at 21:00 UTC daily (= 18:00 BRT). Vercel Hobby caps us to 2 cron jobs,
# so this second trigger lives in GitHub Actions and calls the same endpoint
# with ?period=evening.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call payment-alerts endpoint (evening)
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://finn-steel.vercel.app/api/cron/payment-alerts?period=evening"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
