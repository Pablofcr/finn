name: Payment alerts — evening nudge

# Runs at 22:30 UTC daily (= 19:30 BRT). Squad decision 2026-06-02: 18h
# pegava trânsito/reunião final/médico ainda no consultório; 19h30 é a
# janela pós-jantar com runway de 2-3h pré-corte bancário (Pix 24/7,
# boleto até 22-23h59). Vercel Hobby cap = 2 crons, então o run da noite
# fica em GitHub Actions chamando o mesmo endpoint com ?period=evening.
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call payment-alerts endpoint (evening)
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://finn-steel.vercel.app/api/cron/payment-alerts?period=evening"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
